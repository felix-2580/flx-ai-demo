<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050916"><meta name="description" content="FLX.AI voice-controlled Windows assistant"><title>FLX.AI — Your AI Assistant</title>
<style>
:root{color-scheme:dark;--bg:#050916;--panel:rgba(10,19,43,.82);--line:rgba(94,139,255,.24);--text:#eef5ff;--muted:#91a7cf;--cyan:#20d8ff;--green:#35f6a0;--red:#ff5e86}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#10255a 0,transparent 42%),radial-gradient(ellipse at 80% 70%,#24104b 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,60px);border-bottom:1px solid #172548}.brand{font-size:25px;font-weight:850;letter-spacing:.1em}.brand b{color:#9b6dff}.brand small{display:block;font-size:9px;letter-spacing:.18em;color:#8198c8;font-weight:500}.status{border:1px solid var(--line);border-radius:30px;padding:9px 13px;font-size:11px;color:#bdd0f5}.dot{display:inline-block;width:7px;height:7px;background:#ffbc55;border-radius:50%;margin-right:7px}.main{width:min(900px,94vw);margin:auto;display:flex;flex-direction:column;align-items:center;flex:1;padding:14px 0 0}.hero{text-align:center}.orb-wrap{height:clamp(210px,32vh,300px);display:grid;place-items:center;width:min(650px,92vw);position:relative}.orb{width:clamp(155px,24vh,230px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 28% 20%,#b2faff 0,#1bd8ff 8%,#0872ff 31%,#2a16c6 62%,#10072e 83%);border:1px solid #7beaff;box-shadow:inset -15px -20px 34px #030728aa,inset 8px 9px 25px #b4ffff99,0 0 28px #087aff,0 0 75px #124effaa,0 0 115px #7c2cff44;transform:scale(calc(1 + var(--level,0)*.1));transition:transform .08s,filter .2s}.orb:before,.orb:after{content:"";position:absolute;inset:-10%;border:1px solid #27dfffbb;border-radius:50%;transform:rotate(-28deg) scaleY(.38);animation:orbit 7s linear infinite}.orb:after{inset:-15%;border-color:#a64dffbb;transform:rotate(48deg) scaleY(.3);animation-duration:9s;animation-direction:reverse}.core{width:44%;height:44%;border:1px solid #b8faff66;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#3cecff99,#0b1978 70%,#160438);box-shadow:0 0 25px #1ab8ff66}.wave{display:flex;gap:4px;align-items:center}.wave i{width:4px;height:13px;border-radius:4px;background:#a2faff;box-shadow:0 0 10px #20d8ff;animation:wave 1s ease-in-out infinite}.wave i:nth-child(2),.wave i:nth-child(4){height:25px;animation-delay:.2s}.wave i:nth-child(3){height:37px;animation-delay:.4s}.hero h1{font-size:clamp(27px,4vw,42px);margin:0 0 7px;background:linear-gradient(90deg,#24e1ff,#8d80ff,#c16dff);color:transparent;background-clip:text}.hero p{color:#a5bdf0;margin:0;font-size:14px}.sub{font-size:11px!important;color:#7086b6!important;margin-top:8px!important}.modes{display:flex;gap:8px;margin:13px 0 3px}.mode{border:1px solid var(--line);border-radius:20px;padding:8px 16px;background:#0a1530;color:#a9bee8;font-size:11px}.mode.active{border-color:#24dfff;color:#fff;background:#0b3560;box-shadow:0 0 16px #167bff44}.chat{width:100%;max-width:760px;display:flex;flex-direction:column;gap:9px;padding:12px 5px;max-height:clamp(95px,20vh,190px);overflow:auto;flex:1;min-height:20px}.message{display:flex}.message.user{justify-content:flex-end}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:12px;line-height:1.55;color:#e1ecff}.message.user .bubble{border-color:#246bbd;background:#0c2850}.result-link{display:inline-block;margin-top:8px;color:#58eaff;text-decoration:none;border:1px solid #23617a;border-radius:8px;padding:6px 10px}.bottom{width:100%;margin-top:auto;padding:12px 0 20px;background:linear-gradient(transparent,#050916 18%)}.composer{width:100%;max-width:780px;margin:auto}.shell{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #2189d9;border-radius:30px;background:#081329;box-shadow:0 0 25px #126bff22}.shell:focus-within{border-color:#48eaff;box-shadow:0 0 24px #00aaff33}input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;padding:11px 5px;font:inherit;font-size:13px}input::placeholder{color:#7188b6}.btn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid #263e70;background:#0d2045;color:#d9f8ff;font-size:17px}.btn.send{background:linear-gradient(135deg,#008eff,#662dff);border-color:#578eff}.samples-label{margin:12px 4px 7px;color:#6178a7;font-size:9px;letter-spacing:.15em}.samples{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.samples button{border:1px solid #1d3158;border-radius:20px;background:#09142b;color:#9ab0d8;padding:7px 10px;font-size:10px}.footer{text-align:center;color:#4d628e;font-size:9px;margin-top:15px;letter-spacing:.07em}.orb.listening{filter:hue-rotate(55deg);box-shadow:0 0 35px #9d3bff,0 0 90px #7e20ff88}.orb.success{filter:hue-rotate(95deg)}.orb.error{filter:hue-rotate(300deg)}@keyframes orbit{to{rotate:360deg}}@keyframes wave{0%,100%{transform:scaleY(.5);opacity:.65}50%{transform:scaleY(1.15);opacity:1}}@media(max-width:600px){.top{height:65px;padding:0 14px}.brand{font-size:20px}.status{font-size:10px;padding:8px}.main{padding-top:8px}.orb-wrap{height:clamp(175px,25vh,225px)}.orb{width:clamp(140px,22vh,175px)}.shell{gap:4px;padding:6px}.btn{width:38px;height:38px}.chat{max-height:21vh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><div class="app"><header class="top"><div class="brand"><b>✦</b> FLX.AI<small>VOICE-CONTROLLED WINDOWS ASSISTANT</small></div><div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Checking companion…</span></div></header><main class="main"><section class="hero"><div class="orb-wrap"><div class="orb" id="orb"><div class="core"><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div></div></div><h1>Your AI Assistant</h1><p>Speak naturally. Make things happen.</p><p class="sub" id="subText">Local commands run through the companion on this Windows PC.</p><div class="modes"><button class="mode active" id="localMode">LOCAL MODE</button><button class="mode" id="aiMode">AI MODE</button></div></section><section class="chat" id="chat" aria-live="polite"></section><section class="bottom"><div class="composer"><div class="shell"><button class="btn" id="mic" title="Speak a command" aria-label="Speak a command">♩</button><input id="command" autocomplete="off" placeholder="Try “open calculator” or ask a question…"><button class="btn send" id="send" title="Execute command" aria-label="Execute command">➤</button></div><div class="samples-label">QUICK COMMANDS</div><div class="samples"><button data-command="open calculator">Calculator</button><button data-command="open task manager">Task Manager</button><button data-command="open downloads">Downloads</button><button data-command="increase volume">Volume up</button><button data-command="search Python tutorials">Google search</button></div><div class="footer">FLX.AI <span>•</span> LOCAL-FIRST EXECUTION <span>•</span> AI WHEN ENABLED</div></div></section></main></div>
<script>
const input=document.getElementById('command'),send=document.getElementById('send'),chat=document.getElementById('chat'),orb=document.getElementById('orb'),statusText=document.getElementById('statusText'),dot=document.getElementById('dot'),subText=document.getElementById('subText'),mic=document.getElementById('mic'),localMode=document.getElementById('localMode'),aiMode=document.getElementById('aiMode');let busy=false,mode='local',recognition=null,listening=false,stream=null,audioContext=null,analyser=null,frame=null;
function setStatus(text,state='idle'){statusText.textContent=text;orb.classList.remove('listening','success','error');if(state!=='idle')orb.classList.add(state);dot.style.background=state==='error'?'#ff5e86':state==='success'?'#35f6a0':state==='listening'?'#b46bff':'#ffbc55';}
function addMessage(type,text,url){const row=document.createElement('div');row.className='message '+type;const bubble=document.createElement('div');bubble.className='bubble';const content=document.createElement('div');content.textContent=text;bubble.appendChild(content);if(url){try{const u=new URL(url);if(u.protocol==='https:'&&['www.google.com','www.youtube.com','chatgpt.com','github.com'].includes(u.hostname)){const a=document.createElement('a');a.className='result-link';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open link ↗';bubble.appendChild(a);}}catch(_){}}row.appendChild(bubble);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return row;}
async function executeCommand(value){const command=value.trim();if(!command||busy)return;addMessage('user',command);input.value='';busy=true;send.disabled=true;const pending=addMessage('ai','Working…');setStatus(mode==='ai'?'Thinking…':'Executing command…');try{let res,data;if(mode==='ai'){res=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,mode:'ai'})});data=await res.json();}else{const sendLocal=async confirmed=>{return await fetch('http://127.0.0.1:8765/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,confirmed}),signal:AbortSignal.timeout(20000)});};try{res=await sendLocal(false);data=await res.json();if(data.confirmation_required){const approved=window.confirm(data.message);if(approved){res=await sendLocal(true);data=await res.json();}else{data={success:false,state:'error',message:'Action cancelled. No change was made.',command};res={ok:false};}}}catch(e){pending.remove();addMessage('ai','Windows Companion is not connected. Start the latest FLXAI-Companion.exe on this same Windows PC and keep it running.');setStatus('Companion not connected','error');return;}}pending.remove();addMessage('ai',data.message||'No response received.',data.url);const failed=data.success===false||data.state==='error'||data.category==='error'||!res.ok;setStatus(failed?'Command failed':'Ready',failed?'error':'success');}catch(e){pending.remove();addMessage('ai',mode==='ai'?'I couldn’t reach the FLX.AI AI service. Check your internet connection and try again.':'I couldn’t reach FLX.AI. Check the companion and try again.');setStatus('Connection error','error');}finally{busy=false;send.disabled=false;input.focus();}}
send.addEventListener('click',()=>executeCommand(input.value));input.addEventListener('keydown',e=>{if(e.key==='Enter')executeCommand(input.value)});document.querySelectorAll('.samples button').forEach(b=>b.addEventListener('click',()=>executeCommand(b.dataset.command)));function setMode(next){mode=next;localMode.classList.toggle('active',mode==='local');aiMode.classList.toggle('active',mode==='ai');subText.textContent=mode==='local'?'Windows actions run through the companion on this PC.':'Ask questions, write code, or brainstorm with AI. Requires a configured AI key.';}localMode.addEventListener('click',()=>setMode('local'));aiMode.addEventListener('click',()=>setMode('ai'));
async function checkCompanion(){try{const r=await fetch('http://127.0.0.1:8765/health',{signal:AbortSignal.timeout(2500)});const d=await r.json();if(r.ok&&d.ok){setStatus('Companion v'+(d.version||'?')+' connected','success');return;}}catch(e){}setStatus('Web ready • companion offline');}checkCompanion();
function stopMeter(){if(frame!==null)cancelAnimationFrame(frame);frame=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(audioContext){audioContext.close().catch(()=>{});audioContext=null;}analyser=null;orb.style.setProperty('--level','0');}async function startMeter(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new(window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=256;audioContext.createMediaStreamSource(stream).connect(analyser);const a=new Uint8Array(analyser.frequencyBinCount);function tick(){if(!analyser)return;analyser.getByteTimeDomainData(a);let s=0;for(const n of a){const v=(n-128)/128;s+=v*v;}orb.style.setProperty('--level',String(Math.min(1,Math.sqrt(s/a.length)*5)));frame=requestAnimationFrame(tick);}tick();return true;}catch(e){addMessage('ai','Microphone access was denied. You can still type commands.');return false;}}function stopListening(){listening=false;stopMeter();mic.textContent='♩';if(recognition){try{recognition.stop()}catch(e){}}setStatus('Ready');}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;mic.addEventListener('click',async()=>{if(listening){stopListening();return;}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!SR){addMessage('ai','Speech recognition is unavailable in this browser. Try Chrome or type your command.');return;}if(!await startMeter())return;listening=true;mic.textContent='■';setStatus('Listening…','listening');recognition=new SR();recognition.lang='en-IN';recognition.interimResults=false;recognition.continuous=false;recognition.onresult=e=>{const spoken=e.results[0][0].transcript;stopMeter();listening=false;mic.textContent='♩';executeCommand(spoken)};recognition.onerror=()=>stopListening();recognition.onend=()=>{if(listening)stopListening()};try{recognition.start()}catch(e){stopListening()}});window.addEventListener('pagehide',stopMeter);
</script></body></html>
